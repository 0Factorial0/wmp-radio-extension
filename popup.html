<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WMP Battery - Embeddable Block</title>
        <style>
            .embed-block {
                background: radial-gradient(circle at 50% 0%, #10152f 0%, #080914 38%, #030308 100%);
                color: #02030a;
                margin: 0;
                padding: 15px;
                display: inline-flex;
                flex-direction: column;
                align-items: center;
                font-family: monospace;
                border: none;
                box-shadow: none;
                border-radius: 0;
                position: relative;
                width: 230px;
            }
            .embed-block h1 { 
                margin: 0 0 5px 0;
                font-size: 14px;
                color: #61ffda;
                text-shadow: 0 0 8px currentColor, 0 0 22px currentColor;
                letter-spacing: 2px;
            }
            .embed-block .main-container {
                border: 2px solid #61ffda;
                margin-bottom: 10px;
                box-shadow: 0 0 15px rgba(97,255,218,.22), 0 0 45px rgba(139,92,246,.10);
                background: linear-gradient(135deg, rgba(97,255,218,.12), rgba(139,92,246,.10), rgba(255,70,180,.08));
                border-radius: 0;
            }
            .embed-block canvas#mainCvs {
                width: 160px;
                height: 160px;
                background: #02030a;
                display: block;
                image-rendering: pixelated;
            }
            .embed-block .radio-box {
                margin-bottom: 10px;
                background: linear-gradient(145deg, #111426, #080914);
                border: 1px solid #8b5cf6;
                padding: 6px;
                display: flex;
                flex-direction: column;
                gap: 5px;
                box-shadow: 0 0 12px rgba(139,92,246,.28), inset 0 0 12px rgba(97,255,218,.06);
                border-radius: 0;
                width: 100%;
                box-sizing: border-box;
            }
            .embed-block .radio-box select, .embed-block .radio-box audio {
                background: #02030a;
                color: #61ffda;
                font-family: monospace;
                font-size: 10px;
                outline: none;
            }
            .embed-block .radio-box select {
                border: 1px solid #61ffda;
                border-radius: 0;
            }
            .embed-block .transition-info {
                margin-top: 0;
                margin-bottom: 5px;
                min-height: 14px;
                color: #61ffda;
                font-size: 9px;
                letter-spacing: 1px;
                text-align: center;
                text-shadow: 0 0 6px currentColor;
            }
            html, body {
                margin: 0 !important;
                padding: 0 !important;
                width: 100%;
                height: 100%;
                background-color: #02030a;
            }
            #popup-root {
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
        </style>
    </head>
